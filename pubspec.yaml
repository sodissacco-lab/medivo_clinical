name: medivo_clinical
description: "Medivo Clinical: offline-first clinical reference and decision support."
publish_to: 'none'
version: 0.11.0+11

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  sqflite: ^2.4.0
  path: ^1.9.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled inside the app so they work fully offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500